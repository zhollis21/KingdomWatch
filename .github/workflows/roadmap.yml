name: Roadmap

# Regenerates the roadmap from issues, milestones and their "blocked by"
# relationships (tools/Build-Roadmap.ps1), syncs the derived `blocked` label,
# and publishes the result to GitHub Pages. Nothing is committed, so the
# branch ruleset on main never comes into it.
#
# Relationship edits do not fire a webhook, so the nightly run is the
# backstop for re-wired dependencies; everything else (open, close, label,
# milestone) republishes within a minute or two. Run it by hand with
# `gh api -X POST repos/zhollis21/KingdomWatch/actions/workflows/roadmap.yml/dispatches -f ref=main`
# (`gh workflow run` resolves the default branch over GraphQL, which Claude
# Code sessions are refused).
#
# A merge to main does NOT republish. The pull_request run below already
# publishes with the merged generator, and a merge that both touches the
# tooling and closes an issue used to fire twice a second apart - once for the
# push and once for the closure - doing identical work. The closure event is
# the one that matters, because it is the one whose result changed.
#
# A pull request that touches the tooling runs this same job in full — label
# sync and deploy included — so the change is exercised for real before it
# merges. That is a deliberate choice for a single-maintainer repository:
# the PR author already has write access, and a check that only pretends to
# publish has failed to catch a publish that broke.
#
# Pages must be enabled once in Settings > Pages with Source set to
# "GitHub Actions"; until then the deploy step fails and nothing else does.

on:
  pull_request:
    branches: [main]
    paths:
      - tools/Build-Roadmap.ps1
      - tools/roadmap-index.html
      - .github/workflows/roadmap.yml
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  milestone:
    types: [created, edited, deleted, closed, opened]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

# One publish at a time. The group is a fixed string rather than per-ref on
# purpose: a pull request run deploys to Pages like any other, so two runs on
# different refs must still not deploy at once.
#
# Superseded runs are cancelled. Every run regenerates from live GitHub state,
# so a queued one is doing work the newer one is about to redo - and issue
# events arrive in bursts, where a bulk label or relationship edit would
# otherwise serialise a run apiece.
#
# The tradeoff, decided deliberately: GitHub's Pages guidance recommends
# cancel-in-progress: false so a deploy is never killed mid-flight, and a run
# cancelled inside actions/deploy-pages can leave the github-pages environment
# needing a manual nudge. If a deploy ever wedges, this is the first line to
# suspect.
concurrency:
  group: roadmap
  cancel-in-progress: true

jobs:
  publish:
    name: Generate and publish roadmap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build roadmap and sync the blocked label
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/Build-Roadmap.ps1 -SyncLabels -OutDir site

      - name: Show the result in the job summary
        shell: pwsh
        run: Get-Content site/README.md, site/next.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
