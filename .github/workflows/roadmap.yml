name: Roadmap

# Regenerates the roadmap from issues, milestones and their "blocked by"
# relationships (tools/Build-Roadmap.ps1), syncs the derived `blocked` label,
# and publishes the result to GitHub Pages. Nothing is committed, so the
# branch ruleset on main never comes into it.
#
# Relationship edits do not fire a webhook, so the nightly run is the
# backstop for re-wired dependencies; everything else (open, close, label,
# milestone) republishes within a minute or two, as does a change to the
# generator, the viewer or this file landing on main. Run it by hand with
# `gh workflow run roadmap.yml`.
#
# A pull request that touches the tooling runs this same job in full — label
# sync and deploy included — so the change is exercised for real before it
# merges. That is a deliberate choice for a single-maintainer repository:
# the PR author already has write access, and a check that only pretends to
# publish has failed to catch a publish that broke.
#
# Pages must be enabled once in Settings > Pages with Source set to
# "GitHub Actions"; until then the deploy step fails and nothing else does.

on:
  push:
    branches: [main]
    paths:
      - tools/Build-Roadmap.ps1
      - tools/roadmap-index.html
      - .github/workflows/roadmap.yml
  pull_request:
    branches: [main]
    paths:
      - tools/Build-Roadmap.ps1
      - tools/roadmap-index.html
      - .github/workflows/roadmap.yml
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  milestone:
    types: [created, edited, deleted, closed, opened]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

# One publish at a time, and never cancel one that is mid-deploy.
concurrency:
  group: roadmap
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish roadmap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build roadmap and sync the blocked label
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/Build-Roadmap.ps1 -SyncLabels -OutDir site

      - name: Show the result in the job summary
        shell: pwsh
        run: Get-Content site/README.md, site/next.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
